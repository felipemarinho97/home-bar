<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home Bar — Admin</title>
  <link rel="stylesheet" href="/static/admin/admin.css">
</head>
<body>
  <div id="login-screen" class="login-screen">
    <div class="login-card">
      <h1>Home Bar Admin</h1>
      <form id="login-form">
        <input type="text" id="login-username" placeholder="Username" value="admin" required>
        <input type="password" id="login-password" placeholder="Password" required>
        <button type="submit">Sign In</button>
        <p id="login-error" class="error-msg hidden"></p>
      </form>
    </div>
  </div>

  <div id="app-screen" class="app-screen hidden">
    <nav class="sidebar">
      <h2>Home Bar</h2>
      <ul>
        <li data-tab="inventory" class="active">Inventory</li>
        <li data-tab="ingredient-types">Ingredient Types</li>
        <li data-tab="cocktails">Cocktails</li>
      </ul>
      <div class="sidebar-footer">
        <button id="logout-btn" class="logout-btn">Logout</button>
      </div>
      </ul>
    </nav>

    <main class="main-content">
      <div id="tab-inventory" class="tab-pane active">
        <div class="tab-header">
          <h3>Inventory</h3>
          <button class="btn primary" onclick="showInventoryForm()">+ Add Item</button>
        </div>
        <div class="filters">
          <select id="inventory-filter" onchange="loadInventory()">
            <option value="">All Categories</option>
            <option value="spirit">Spirits</option>
            <option value="mixer">Mixers</option>
            <option value="syrup">Syrups</option>
            <option value="fruit">Fruit</option>
            <option value="accessory">Accessories</option>
            <option value="glass">Glassware</option>
          </select>
        </div>
        <div id="inventory-list" class="item-list"></div>
      </div>

      <div id="tab-ingredient-types" class="tab-pane">
        <div class="tab-header">
          <h3>Ingredient Types</h3>
          <button class="btn primary" onclick="showIngredientTypeForm()">+ Add Type</button>
        </div>
        <div id="ingredient-types-list" class="item-list"></div>
      </div>

      <div id="tab-cocktails" class="tab-pane">
        <div class="tab-header">
          <h3>Cocktails</h3>
          <div style="display:flex;gap:0.5rem">
            <button class="btn secondary" onclick="aiSuggestCocktails()">&#x2728; Suggest</button>
            <button class="btn primary" onclick="showCocktailForm()">+ Add Cocktail</button>
          </div>
        </div>
        <div id="cocktails-list" class="item-list"></div>
      </div>
    </main>
  </div>

  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal" id="modal-content"></div>
  </div>

  <div id="sub-modal-overlay" class="modal-overlay hidden" style="z-index:250">
    <div class="modal" id="sub-modal-content"></div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="/static/admin/admin.js"></script>
</body>
</html>
